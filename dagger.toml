# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.python-sdk]
source = "github.com/dagger/python-sdk"
# Its `stale` check fails until `dagger generate` works again (docs/lint.md).
check.skip = ["*"]

[sdks.python]
module = "python-sdk"

[modules.install-tests]
source = ".dagger/modules/install-tests"
# Keep these out of `dagger check` and Dagger Cloud Checks, which run only the lint checks.
# `make test-install` calls them in script mode (`dagger -c`), which this skip does not affect.
check.skip = ["*"]

[sdks.python.scopes.".dagger/modules/install-tests"]
is-module = true
name = "install-tests"

[modules.lint]
source = ".dagger/modules/lint"

[sdks.python.scopes.".dagger/modules/lint"]
is-module = true
name = "lint"
