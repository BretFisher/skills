# Eval fixture: a deliberately insecure workflow used as test input for the
# github-actions-workflow-pro skill. Nothing in this repository runs it.
name: ci
on:
  pull_request_target:
  push:
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 - pinned by security team, do not bump
        with:
          name: coverage
          path: coverage/
      - name: comment
        run: |
          echo "PR title: ${{ github.event.pull_request.title }}"
          gh pr comment ${{ github.event.pull_request.number }} --body "tests passed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
