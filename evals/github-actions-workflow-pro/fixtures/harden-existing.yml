# Eval fixture: a build-and-deploy workflow with a privileged PR trigger, write-all permissions,
# shell docker push, and static cloud keys, used as test input for the github-actions-workflow-pro
# skill. Nothing in this repository runs it.
name: build-deploy
on:
  pull_request_target:
  push:
    branches: [main]
permissions: write-all
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build and push image
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/api:${{ github.sha }}" . && docker push "$REGISTRY/api:${{ github.sha }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
      - name: Deploy
        run: aws lambda update-function-code --function-name api --image-uri "$REGISTRY/api:${{ github.sha }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
