---
# Keep GitHub Actions references up to date (SHA pins / versions).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
# NOTE: this repo has no workflows today; Dagger Cloud Checks run the linters.
# Dependabot manages any SHA-pinned actions added later.

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
