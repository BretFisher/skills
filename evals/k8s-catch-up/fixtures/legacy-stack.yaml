# Manifests a team wrote for Kubernetes v1.30 and now wants to run on a v1.37 cluster.
apiVersion: v1
kind: Pod
metadata:
  name: site-builder
  namespace: web
spec:
  containers:
    - name: hugo
      image: ghcr.io/example/hugo:0.130
      command: ["hugo", "--source", "/src", "--destination", "/public"]
      volumeMounts:
        - name: src
          mountPath: /src
        - name: public
          mountPath: /public
  volumes:
    - name: src
      gitRepo:
        repository: https://github.com/example/site.git
        revision: main
    - name: public
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-ingress
  namespace: web
spec:
  selector:
    app: edge
  ports:
    - port: 80
      targetPort: 8080
  externalIPs:
    - 203.0.113.10
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
mode: ipvs
ipvs:
  scheduler: rr
