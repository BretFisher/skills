# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.python-sdk]
source = "github.com/dagger/python-sdk"

[sdks.python]
module = "python-sdk"

[modules.install-tests]
source = ".dagger/modules/install-tests"

[sdks.python.scopes.".dagger/modules/install-tests"]
is-module = true
name = "install-tests"
